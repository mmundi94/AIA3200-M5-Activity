<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Activity: Who Handles the Missed Dose?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Azeret+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff1ea; --ink:#1e1b2e; --soft:#5e586f;
    --blue:#0b5394; --violet:#582fc1;
    --tom:#ff5a5f; --mint:#1fbf86; --butter:#ffc93c; --butterD:#b98600; --orch:#d65db1;
    --ok:#159a62; --miss:#e8344e;
    --sans:"Lexend","Segoe UI",system-ui,sans-serif; --mono:"Azeret Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.5;padding-bottom:92px;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background:radial-gradient(40% 30% at 0% 0%,rgba(255,90,95,.30),transparent 70%),radial-gradient(40% 35% at 100% 30%,rgba(31,191,134,.28),transparent 70%),
               radial-gradient(45% 35% at 20% 100%,rgba(214,93,177,.28),transparent 70%),radial-gradient(35% 30% at 85% 100%,rgba(255,201,60,.35),transparent 70%)}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12  0 0 0 0 .1  0 0 0 0 .18  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .wrap{max-width:1040px;margin:0 auto;padding:16px 16px 20px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .brand b{display:block;font-size:18px;color:var(--blue);font-weight:800}
  .brand span{font-family:var(--mono);font-size:11.5px;color:var(--soft)}
  .chip{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--violet);padding:8px 14px;border-radius:10px 10px 10px 2px}

  /* hero stage */
  .hero{position:relative;border-radius:30px;overflow:hidden;color:#fff;
    background:linear-gradient(120deg,var(--hc1,#ff5a5f) 0%,var(--hc2,#d65db1) 55%,var(--violet) 100%);
    display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);min-height:270px;box-shadow:0 22px 50px -28px rgba(88,47,193,.8)}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .hero .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;animation:orbit 12s ease-in-out infinite alternate}
  .hero .b1{width:160px;height:160px;background:var(--butter);left:-40px;bottom:-60px}
  .hero .b2{width:110px;height:110px;background:var(--mint);right:30%;top:-50px;animation-delay:-4s}
  @keyframes orbit{to{transform:translate(30px,-20px) scale(1.15)}}
  .hero-text{position:relative;z-index:1;padding:24px 10px 24px 26px;display:flex;flex-direction:column;justify-content:center}
  .hero-text .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;opacity:.9}
  .hero-text h2{margin:6px 0 6px;font-size:clamp(22px,3vw,32px);line-height:1.1;font-weight:800}
  .hero-text p{margin:0;font-size:14px;opacity:.92}
  .scene{position:relative;z-index:1;margin:14px;border-radius:22px;background:rgba(255,255,255,.93);color:var(--ink);min-height:290px;overflow:hidden}
  .scap{position:absolute;left:12px;right:12px;bottom:8px;font-size:12.5px;color:var(--soft);text-align:center;min-height:18px}
  .scap b{color:var(--ink)}

  /* question */
  .qcard{max-width:820px;margin:18px auto 0;position:relative;z-index:2;background:#fff;border-radius:24px;padding:22px 24px;box-shadow:0 16px 40px -24px rgba(30,27,46,.55)}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--sc,var(--blue))}
  .pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--scs,#eef)}
  h1{font-size:clamp(28px,4.5vw,44px);line-height:1.05;margin:6px 0 12px;font-weight:800;letter-spacing:-.8px}
  .u{text-decoration:underline;text-decoration-color:var(--butter);text-decoration-thickness:8px;text-underline-offset:-2px;text-decoration-skip-ink:none}
  p{margin:0 0 12px}
  .lead{font-size:16px;color:var(--soft)}
  .prompt{font-size:19px;font-weight:600;line-height:1.4;margin:12px 0 12px;overflow-wrap:anywhere}
  .ask{font-size:14px;font-weight:600;color:var(--soft);margin-bottom:10px}
  .opts{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
  .opt{font-family:var(--sans);text-align:left;cursor:pointer;background:#fff;border:2px solid var(--cs);border-radius:16px;padding:11px 12px;display:flex;align-items:center;gap:11px;
    font-size:15px;font-weight:600;color:var(--ink);position:relative;transition:transform .12s,background .12s}
  .opt .oi{flex:0 0 38px;height:38px;border-radius:11px;background:var(--cs);color:var(--c);display:grid;place-items:center;transition:transform .3s}
  .opt .oi svg{width:24px;height:24px}
  .opt small{display:block;font-weight:400;font-size:12px;color:var(--soft)}
  .opt:hover:not([disabled]){transform:translateY(-2px);background:var(--cs)}
  .opt:hover:not([disabled]) .oi{transform:rotate(-8deg) scale(1.08)}
  .opt[disabled]{cursor:default}.opt.dim{opacity:.4}
  .opt.mine.right{border-color:var(--ok);background:#e3f6ec}
  .opt.mine.wrong{border-color:var(--miss);background:#fde5e9}
  .opt.truth{border-color:var(--ok);border-style:dashed;background:#f0faf5}
  .tag{position:absolute;top:-10px;right:10px;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .tag.ok{background:var(--ok);color:#fff}.tag.no{background:var(--miss);color:#fff}.tag.ans{background:#fff;color:var(--ok);border:1.5px solid var(--ok)}
  .status{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:#f7f2ff}
  .status .m{display:flex;align-items:center;gap:10px;font-weight:600}
  .dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
  .dot.ok{background:var(--ok)}.dot.no{background:var(--miss)}
  .btn{font-family:var(--sans);font-weight:800;font-size:15.5px;border:0;cursor:pointer;background:var(--blue);color:#fff;padding:12px 22px;border-radius:14px 14px 14px 4px;transition:transform .12s, box-shadow .12s;box-shadow:4px 4px 0 var(--butter)}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--butter)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--butter)}
  .btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
  .btn:focus-visible,.opt:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
  .lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 18px}
  .lane{border-radius:18px;padding:12px;background:var(--cs);border-top:5px solid var(--c)}
  .lane b{display:block;font-size:14.5px}.lane small{font-size:12px;color:var(--soft)}
  .lane .li{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--c);display:grid;place-items:center;margin-bottom:6px}
  .lane .li svg{width:22px;height:22px}
  .note{font-size:13.5px;color:var(--soft)}
  .keys{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
  .key{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--cs);color:var(--ink)}

  /* dock */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-top:3px solid var(--violet)}
  .dock-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center}
  .dgroup{flex:var(--n);min-width:0}
  .dgroup .dl{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
  .dgroup.cur .dl{color:var(--ink)}
  .ddots{display:flex;gap:3px;margin-top:4px}
  .ddots i{flex:1;height:10px;border-radius:4px;background:#ece6f2;transition:background .3s}
  .ddots i.ok{background:var(--ok)}.ddots i.no{background:var(--miss)}.ddots i.cur{background:var(--c);animation:breathe 1.2s infinite}
  @keyframes breathe{50%{opacity:.4}}
  .dcount{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap}

  /* scene: workers */
  .ws{position:absolute;inset:0;padding:16px 14px 30px}
  .ticket{position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:78%;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:12px;
    box-shadow:0 8px 18px -8px rgba(0,0,0,.5);transition:transform .75s cubic-bezier(.5,-.2,.3,1.3),opacity .3s;z-index:3;text-align:center;animation:hover 2.4s ease-in-out infinite}
  @keyframes hover{50%{margin-top:-5px}}
  .ticket.go{animation:none}
  .workers{position:absolute;left:12px;right:12px;bottom:34px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .wk{border-radius:16px;background:var(--cs);text-align:center;padding:10px 4px 8px;border:2px solid transparent;transition:transform .3s}
  .wk .wi{width:46px;height:46px;margin:0 auto 4px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
  .wk .wi svg{width:28px;height:28px}
  .wk b{font-size:12px;display:block;line-height:1.2}
  .wk.catch{border-color:var(--ok);animation:catch .6s ease}
  @keyframes catch{30%{transform:translateY(-10px) scale(1.06)}60%{transform:translateY(2px)}}
  .wk.bad{border-color:var(--miss);animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  .idle .wk{animation:bob 2.6s ease-in-out infinite}.idle .wk:nth-child(2){animation-delay:.3s}.idle .wk:nth-child(3){animation-delay:.6s}.idle .wk:nth-child(4){animation-delay:.9s}
  @keyframes bob{50%{transform:translateY(-6px)}}

  .svgwrap{position:absolute;inset:8px 8px 28px}
  .svgwrap>svg{width:100%;height:100%;display:block}
  #beam{transition:transform 1s cubic-bezier(.3,1.6,.5,1);transform-origin:180px 64px}
  .wdrop{animation:wdrop .7s cubic-bezier(.3,1.5,.5,1)}
  @keyframes wdrop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
  #needle{transition:transform 1.1s cubic-bezier(.3,1.6,.5,1);transform-origin:180px 168px}
  .panels{position:absolute;inset:14px 14px 32px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pn{border-radius:18px;padding:12px;text-align:center;background:var(--cs);border:2px solid transparent;transition:opacity .4s, transform .4s}
  .pn .art{height:80px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--c)}
  .pn .art svg{width:46px;height:46px}
  .pn b{display:block;font-size:14px}.pn small{font-size:11.5px;color:var(--soft)}
  .pn.win{border-color:var(--ok);transform:scale(1.03)}.pn.lose{opacity:.35}.pn.bad{border-color:var(--miss)}
  .typing{display:inline-flex;gap:3px}.typing i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:breathe 1s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  .flow{position:absolute;inset:20px 12px 40px;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .fn{flex:1;text-align:center;border-radius:16px;padding:10px 4px;background:var(--cs);border:2px solid transparent;position:relative;z-index:1}
  .fn .wi{width:42px;height:42px;margin:0 auto 4px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center}
  .fn .wi svg{width:24px;height:24px}
  .fn b{font-size:12.5px;display:block}.fn small{font-size:10.5px;color:var(--soft);display:block;line-height:1.2}
  .fn.win{border-color:var(--ok);animation:catch .6s ease}.fn.bad{border-color:var(--miss);animation:shake .45s}
  .arrow{flex:0 0 26px;height:4px;background:repeating-linear-gradient(90deg,var(--violet) 0 6px,transparent 6px 10px);position:relative;animation:dash .8s linear infinite;background-size:10px 4px}
  @keyframes dash{to{background-position:10px 0}}
  .pkt{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:4px;background:var(--butter);border:2px solid var(--ink);z-index:2;left:6%;animation:travel 2.6s ease-in-out infinite}
  @keyframes travel{0%{left:8%}45%{left:48%}55%{left:48%}100%{left:88%}}
  .grid4{position:absolute;inset:14px 14px 32px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pt{border-radius:14px;background:var(--cs);display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid transparent;transition:opacity .4s}
  .pt .wi{flex:0 0 38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
  .pt .wi svg{width:22px;height:22px}
  .pt b{font-size:12.5px;display:block}.pt small{font-size:10.5px;color:var(--soft);line-height:1.2;display:block}
  .pt.win{border-color:var(--ok);animation:catch .6s ease}.pt.lose{opacity:.35}.pt.bad{border-color:var(--miss);opacity:1}
  .ladder{position:absolute;inset:12px 16px 54px;gap:6px;display:flex;flex-direction:column;justify-content:space-between}
  .rung{display:flex;align-items:center;gap:10px;border-radius:12px;padding:6px 10px;background:#f6f2fb;font-size:12.5px;transition:background .3s,opacity .3s}
  .rung em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--soft);min-width:74px}
  .rung.on{background:#e3f6ec;font-weight:600}
  .rung.off{opacity:.35;text-decoration:line-through}
  .rung .badge{margin-left:auto;white-space:nowrap;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--miss);color:#fff}
  .rung .badge.g{background:var(--ok)}
  .env{display:inline-block;width:16px;height:12px;border-radius:3px;background:var(--orch);border:1.5px solid var(--ink);margin-left:4px;transition:transform .6s,opacity .6s}

  /* final */
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 18px}
  .bcol{border-radius:18px;background:var(--cs);padding:12px;border-top:6px solid var(--c)}
  .bcol .n{font-size:30px;font-weight:800;line-height:1;color:var(--c)}
  .bcol .l{font-size:13px;font-weight:600;margin:4px 0 8px}
  .bcol ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
  .bcol li{font-size:12px;display:flex;gap:6px;align-items:baseline;line-height:1.3}
  .bcol li i{flex:0 0 9px;height:9px;border-radius:3px;background:var(--ok);transform:translateY(1px)}
  .bcol li i.no{background:transparent;border:2px solid var(--miss)}
  .bcol li em{font-style:normal;color:var(--soft)}
  .ideas{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
  .ideas li{border-radius:16px;padding:12px 14px 12px 50px;background:var(--cs);position:relative;font-size:15px}
  .ideas li::before{content:attr(data-n);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:9px;background:var(--c);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center}
  .confetti i{position:absolute;width:10px;height:14px;border-radius:3px;animation:fallc 3.2s linear infinite;opacity:.9}
  @keyframes fallc{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(270px) rotate(540deg)}}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin:-6px 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:800px){
    .hero{grid-template-columns:1fr}
    .hero-text{padding:20px 20px 0}
    .scene{min-height:300px}
    .lanes,.board{grid-template-columns:repeat(2,minmax(0,1fr))}
    .qcard{margin-top:14px}
  }
  @media (max-width:560px){
    .opts{grid-template-columns:1fr!important}
    .qcard{padding:18px}
    .prompt{font-size:17px}
    .lanes,.board{grid-template-columns:1fr}
    .dgroup .dl{font-size:10px}
    .wk b{font-size:10.5px}.wk .wi{width:38px;height:38px}
    .fn small{display:none}
    .rung em{min-width:58px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Nexford University</b><span>AIA3200 · Foundations of Robotics and IoT</span></div>
    <span class="chip">Practice Activity · Module 5</span>
  </header>
  <section class="hero" id="hero">
    <span class="blob b1"></span><span class="blob b2"></span>
    <div class="hero-text" id="htext"></div>
    <div class="scene" id="scene" aria-live="off"></div>
  </section>
  <section class="qcard" id="stage" aria-live="polite"></section>
</div>
<nav class="dock" aria-label="Progress"><div class="dock-in" id="dock"></div></nav>

<script>
(function(){
  "use strict";

    agent:'<circle cx="16" cy="16" r="4"/><path d="M16 4v5M16 23v5M4 16h5M23 16h5"/><path d="M8 8l3 3M21 21l3 3M24 8l-3 3M11 21l-3 3"/>',
    person:'<circle cx="16" cy="9" r="4.5"/><path d="M7 27c0-6 4-10 9-10s9 4 9 10"/>',
    agv:'<rect x="5" y="12" width="22" height="9" rx="2"/><circle cx="10" cy="24" r="2.5"/><circle cx="22" cy="24" r="2.5"/><path d="M3 28h26" stroke-dasharray="3 3"/>',
    amr:'<rect x="6" y="12" width="20" height="9" rx="4"/><circle cx="11" cy="24" r="2.5"/><circle cx="21" cy="24" r="2.5"/><path d="M11 8a7 7 0 0 1 10 0M13.5 10.5a3.5 3.5 0 0 1 5 0"/>',
    thru:'<path d="M5 22h6l3-6 4 10 3-8h6"/><path d="M22 6l4 4-4 4"/>',
    accur:'<circle cx="16" cy="16" r="11"/><circle cx="16" cy="16" r="6"/><circle cx="16" cy="16" r="1.6" fill="currentColor"/>',
    labor:'<circle cx="16" cy="16" r="11"/><path d="M16 9v7l5 3"/>',
    roi:'<path d="M16 4v24"/><path d="M6 10h20"/><path d="M6 10l-3 8h6zM26 10l-3 8h6z"/>',
    good:'<path d="M9 27V14l6-9c2 0 3 2 2.5 4L16 14h9a2 2 0 0 1 2 2.4l-1.8 8.4A3 3 0 0 1 22.3 27z"/><path d="M5 14h4v13H5z"/>',

      if(it.mode==="stop"){
        var steps=[0,1,2];steps.forEach(function(ix,n){later(function(){var r=$("r"+ix);if(r)r.classList.add("on");},300+n*450);});
        later(function(){var r=$("r2");if(r){r.classList.remove("on");r.insertAdjacentHTML("beforeend",'<span class="badge g">dose_taken: stop</span>');}var r3=$("r3");if(r3)r3.classList.add("off");var r2=$("r2");if(r2)r2.classList.add("off");
          cap("The dose was taken, so the ladder <b>stops</b> and records the outcome. No caregiver text about a solved problem.");},1700);
      } else {
        later(function(){var e=document.querySelectorAll("#envs .env");if(e[1]){e[1].style.transform="translateX(-20px)";e[1].style.opacity="0";}if(e[2]){e[2].style.transform="translateX(-40px)";e[2].style.opacity="0";}var r=$("r0");if(r){r.classList.add("on");r.insertAdjacentHTML("beforeend",'<span class="badge g">3 in, 1 kept</span>');}},500);
        later(function(){var r=$("r1");if(r)r.classList.add("on");cap("The rules engine <b>ignores the duplicates</b>, so the ladder runs once and nurses get one task, not three.");},1300);
      }
    }
  };

  /* ---------- UI ---------- */
  function renderDock(){
    $dock.innerHTML=STATIONS.map(function(s,si){
      var cur=(st.screen==="brief"||st.screen==="item")&&si===st.s;
      var dots=s.items.map(function(_,ii){var r=st.res[si][ii];return '<i class="'+(r?(r.ok?"ok":"no"):(cur&&st.screen==="item"&&ii===st.i?"cur":""))+'" style="--c:'+s.c+'"></i>';}).join("");
      return '<div class="dgroup'+(cur?" cur":"")+'" style="--n:'+s.items.length+'"><div class="dl">'+(si+1)+'. '+s.short+'</div><div class="ddots" aria-hidden="true">'+dots+'</div></div>';
    }).join("")+'<span class="dcount">'+st.res.reduce(function(n,a){return n+a.filter(Boolean).length;},0)+' / '+TOTAL+'</span>';
  }
  function heroFor(s){$hero.style.setProperty("--hc1",s?s.hc[0]:"#ff5a5f");$hero.style.setProperty("--hc2",s?s.hc[1]:"#d65db1");}
  function setS(s){$stage.style.setProperty("--sc",s?s.c:"#0b5394");$stage.style.setProperty("--scs",s?s.cs:"#e3edf8");}

  function intro(){
    heroFor(null);setS(null);
    $ht.innerHTML='<span class="k">Module 5 · Automation at Work</span><h2>Every missed dose now creates an event.</h2><p>Nobody has decided what happens next.</p>';
    SC.workers(null,null,false);
    var lanes=STATIONS.map(function(s,si){return '<div class="lane" style="--c:'+s.c+';--cs:'+s.cs+'"><div class="li">'+ic(s.icon)+'</div><b>'+(si+1)+'. '+s.name+'</b><small>'+s.items.length+' items</small></div>';}).join("");
    $stage.innerHTML='<div class="eyebrow">Practice Activity</div><h1>Who Handles the <span class="u">Missed Dose?</span></h1>'+
      '<p class="lead">Sam\'s technicians retype refill requests every shift, and he wants to know whether a dispensing robot would pay off. Grace worries her nurses will stop reading alerts. Dana wants to know what to automate, with which tool, and where a person must stay in charge. Work through four stations and watch each decision play out above.</p>'+
      '<div class="lanes">'+lanes+'</div><p class="note">You get one attempt per item. Your answer is recorded, and you move on. About 15 to 20 minutes.</p><button class="btn" id="go">Start Station 1</button>';
    $("go").onclick=function(){st.screen="brief";st.s=0;render(true);};
  }
  function brief(){
    var s=STATIONS[st.s];heroFor(s);setS(s);
    $ht.innerHTML='<span class="k">Station '+(st.s+1)+' of '+STATIONS.length+'</span><h2>'+s.name+'</h2><p>'+s.items.length+' items</p>';
    SC[s.items[0].scene](s.items[0],null,false);
    var seen={},k="";s.items.forEach(function(it){it.opts.forEach(function(o){if(!seen[o.key]){seen[o.key]=1;k+='<span class="key" style="--cs:'+o.cs+'">'+o.label+'</span>';}});});
    $stage.innerHTML='<div class="eyebrow">Station '+(st.s+1)+'</div><h1 style="font-size:clamp(24px,3.4vw,34px)">'+s.name+'</h1><p class="lead">'+esc(s.brief)+'</p><div class="keys">'+k+'</div><button class="btn" id="go">Begin '+s.items.length+' items</button>';
    $("go").onclick=function(){st.screen="item";st.i=0;render(true);};
  }
  function item(fresh){
    clearT();
    var s=STATIONS[st.s],it=s.items[st.i],r=st.res[st.s][st.i];heroFor(s);setS(s);
    $ht.innerHTML='<span class="k">Station '+(st.s+1)+' · Item '+(st.i+1)+' of '+s.items.length+'</span><h2>'+s.name+'</h2><p>'+esc(it.ask)+'</p>';
    var opts=it.opts.map(function(o){var c="opt",t="";
      if(r){if(o.key===r.k){c+=" mine "+(r.ok?"right":"wrong");t='<span class="tag '+(r.ok?"ok":"no")+'">Your answer</span>';}else if(o.key===it.a){c+=" truth";t='<span class="tag ans">Answer</span>';}else c+=" dim";}
      return '<button class="'+c+'" data-k="'+o.key+'" style="--c:'+o.c+';--cs:'+o.cs+'"'+(r?" disabled":"")+'><span class="oi">'+ic(o.icon)+'</span><span>'+o.label+(o.sub?'<small>'+o.sub+'</small>':'')+'</span>'+t+'</button>';}).join("");
    var last=st.i===s.items.length-1,nx=last?(st.s===STATIONS.length-1?"See your automation blueprint":"Go to Station "+(st.s+2)):"Next item";
    var stat=r?'<div class="status"><div class="m">'+(r.ok?'<span class="dot ok" aria-hidden="true">&#10003;</span>Recorded as correct.':'<span class="dot no" aria-hidden="true">&#215;</span>Recorded as incorrect. The answer is '+esc(find(it.opts,it.a).label)+'.')+'</div><button class="btn" id="next">'+nx+'</button></div>':"";
    var cols=it.cols||2;
    $stage.innerHTML='<div class="qhead"><div class="eyebrow">'+s.name+'</div><span class="pill">Item '+(st.i+1)+' of '+s.items.length+'</span></div><div class="prompt">'+esc(it.q)+'</div><div class="ask">'+esc(it.ask)+'</div><div class="opts" style="--cols:'+cols+'">'+opts+'</div>'+stat;
    SC[it.scene](it,r?r.k:null,!!(r&&fresh));
    if(!r){Array.prototype.forEach.call($stage.querySelectorAll(".opt"),function(b){b.onclick=function(){choose(b.getAttribute("data-k"));};});}
    else{var n=$("next");n.onclick=advance;n.focus({preventScroll:true});}
  }
  function choose(k){if(st.res[st.s][st.i])return;var it=STATIONS[st.s].items[st.i];st.res[st.s][st.i]={k:k,ok:k===it.a};renderDock();item(true);
    try{$("hero").scrollIntoView({behavior:REDUCED?"auto":"smooth",block:"start"});}catch(e){}}
  function advance(){var s=STATIONS[st.s];if(st.i<s.items.length-1)st.i++;else if(st.s<STATIONS.length-1){st.s++;st.i=0;st.screen="brief";}else st.screen="final";render(true);}

  function fin(){
    clearT();heroFor(null);setS(null);
    var right=0;
    var cols=STATIONS.map(function(s,si){var c=st.res[si].filter(function(r){return r&&r.ok;}).length;right+=c;
      var li=s.items.map(function(it,ii){var r=st.res[si][ii];return '<li><i class="'+(r&&r.ok?"":"no")+'"></i><span>'+esc(it.log)+' <em>· '+esc(find(it.opts,it.a).label)+'</em></span></li>';}).join("");
      return '<div class="bcol" style="--c:'+s.c+';--cs:'+s.cs+'"><div class="n">'+c+'/'+s.items.length+'</div><div class="l">'+s.name+'</div><ul>'+li+'</ul></div>';}).join("");
    $ht.innerHTML='<span class="k">Practice Activity complete</span><h2>Automation Blueprint</h2><p>'+right+' of '+TOTAL+' recorded as correct</p>';
    var conf="",cl=["#ffc93c","#1fbf86","#ff5a5f","#582fc1","#0b5394","#d65db1"];for(var i=0;i<22;i++){conf+='<i style="left:'+(4+i*4.4)+'%;background:'+cl[i%6]+';animation-delay:'+(-(i*0.37)%3.2).toFixed(2)+'s;animation-duration:'+(2.6+(i%5)*0.35).toFixed(2)+'s"></i>';}
    $scene.innerHTML='<div class="confetti" aria-hidden="true">'+conf+'</div><div class="ws"><div class="workers" style="bottom:20px">'+WHO.map(function(o){return '<div class="wk" style="--c:'+o.c+';--cs:'+o.cs+';animation:bob 2.6s ease-in-out infinite"><div class="wi">'+ic(o.icon)+'</div><b>'+o.label+'</b></div>';}).join("")+'</div></div>';
    var ideas=IDEAS.map(function(d,i){return '<li data-n="0'+(i+1)+'" style="--c:'+d.c+';--cs:'+d.cs+'">'+esc(d.t)+'</li>';}).join("");
    $stage.innerHTML='<div class="eyebrow">Practice Activity complete</div><h1>Your Automation <span class="u">Blueprint</span></h1>'+
      '<p class="lead">You recorded '+right+' of '+TOTAL+' items as correct. Each column lists every decision and its answer, ready to support the swimlane diagram, step table, and escalation rules in your Module 5 assignment.</p>'+
      '<div class="board">'+cols+'</div><div class="legend"><span><i style="width:10px;height:10px;border-radius:3px;background:var(--ok);display:inline-block"></i>Recorded as correct</span><span><i style="width:10px;height:10px;border-radius:3px;border:2px solid var(--miss);display:inline-block"></i>Recorded as incorrect</span></div>'+
      '<h3 style="margin:0 0 10px">Four ideas to carry into your workflow design</h3><ul class="ideas">'+ideas+'</ul><button class="btn alt" id="again">Start again</button>';
    $("again").onclick=function(){reset();render(true);};
  }
  function render(top){
    renderDock();
    if(st.screen==="intro")intro();else if(st.screen==="brief")brief();else if(st.screen==="item")item(false);else fin();
    if(top){try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}if(st.screen!=="item"){var b=$stage.querySelector(".btn");if(b)b.focus({preventScroll:true});}}
  }
  render(false);
})();
</script>
</body>
</html>
